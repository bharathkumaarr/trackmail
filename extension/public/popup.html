<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trackmail</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <svg class="brand-logo" width="28" height="28" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="7.5" fill="#4F46E5"/>
          <g transform="translate(5.5, 8.5) scale(0.7)">
            <path d="m22 2-7 20-4-9-9-4Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 2 11 13" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <circle cx="25.5" cy="6.5" r="3.2" fill="#F59E0B"/>
        </svg>
        <div class="brand-info">
          <span class="brand-name">Trackmail</span>
          <span class="stealth-badge">100% Stealth</span>
        </div>
      </div>
      <div id="user-info" class="user-pill hidden">
        <span class="status-dot"></span>
        <span id="user-email" class="user-email-text"></span>
        <button id="sign-out-btn" class="sign-out-icon-btn" title="Sign out">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div id="auth-section" class="auth-section">
        <div class="auth-card">
          <div class="auth-badge-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <h2 class="auth-title">Connect your Gmail</h2>
          <p class="auth-desc">Sign in with Google to sync sent emails and view real-time open timestamps.</p>
          <button id="sign-in-btn" class="btn btn-primary">
            <svg class="google-icon" width="16" height="16" viewBox="0 0 24 24">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
              <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12 0 12s.7 2.3 1.9 4.7l3.7-2.9z"/>
              <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
            </svg>
            Sign in with Google
          </button>
        </div>
      </div>

      <div id="emails-section" class="emails-section hidden">
        <div class="section-header">
          <h2 class="section-title">Tracked Activity</h2>
          <button id="refresh-btn" class="btn-refresh" title="Refresh feed">
            <svg class="refresh-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 4v6h-6"></path>
              <path d="M1 20v-6h6"></path>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span>Refresh</span>
          </button>
        </div>
        <div id="email-list" class="email-list"></div>
      </div>

      <p id="error" class="error-banner hidden"></p>
    </main>

    <footer class="app-footer">
      <span class="footer-stealth">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Zero signatures · 100% stealth
      </span>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
