services:
  postgres:
    image: postgres:16-alpine
    container_name: mailtrack-postgres
    environment:
      POSTGRES_USER: mailtrack
      POSTGRES_PASSWORD: mailtrack
      POSTGRES_DB: mailtrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailtrack -d mailtrack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
